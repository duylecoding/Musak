[workspace]
members = [".", "crates/musak-audio"]
resolver = "2"

[package]
name = "musak"
version = "1.0.0"
description = "Musak Producer Studio — Tauri v2 + Rust Real-Time Audio Engine"
edition = "2021"

[lib]
name = "musak_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
musak-audio = { path = "crates/musak-audio" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
